<!DOCTYPE html>
<html>
<head>
    <title>Register - NS Interior Studio AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/register.css') }}">
</head>
<body>

    <nav class="navbar">
        <div class="logo">
            <span class="logo-icon"><i class="fa-solid fa-house"></i></span>
            <div>
                <div class="logo-text">NS <span class="accent">DESIGN</span> AI</div>
                <div class="logo-sub">Transform Your Space with AI</div>
            </div>
        </div>
        <div class="nav-wrapper" id="nav-links">
            <span class="nav-highlight" id="nav-highlight"></span>
            <ul class="nav-links-list">
                <li><a href="/">Home</a></li>
            </ul>
        </div>
    </nav>
    <section class="register-section">
    <div class="register-card">

        <!-- LEFT: Form -->
        <div class="register-form-side">
            <h1>Registration</h1>
            <form id="register-form" onsubmit="return handleRegister();">
                <div class="input-box">
                    <input type="text" id="reg-name" placeholder="Username" required>
                    <i class="fa-solid fa-user"></i>
                </div>
                <div class="input-box">
                    <input type="text" id="reg-email" placeholder="Email" required>
                    <i class="fa-solid fa-envelope"></i>
                </div>
                <div class="input-box">
                    <input type="password" id="reg-pass" placeholder="Password" required>
                    <i class="fa-solid fa-lock toggle-eye" onclick="togglePassword('reg-pass', this)"></i>
                </div>

                <button type="submit" class="register-btn-main">Register</button>
            </form>
        </div>

        <!-- RIGHT: Blob panel -->
        <div class="register-blob-side">
            <h2>Welcome Back!</h2>
            <p>Already have an account?</p>
            <a href="/login" class="ghost-btn">Login</a>
        </div>

    </div>
</section>
    <script src="{{ url_for('static', filename='js/register.js') }}"></script>

</body>
</html>
