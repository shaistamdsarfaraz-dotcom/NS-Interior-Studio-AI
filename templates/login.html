<!DOCTYPE html>
<html>
<head>
    <title>Login - NS Interior Studio AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>

    <nav class="navbar">
        <div class="logo">
            <span class="logo-icon"><i class="fa-solid fa-house"></i></span>
            <div>
                <div class="logo-text">NS <span class="accent">DESIGN</span> AI</div>
                <div class="logo-sub">Transform Your Space with AI</div>
            </div>
        </div>
        <div class="nav-wrapper" id="nav-links">
            <span class="nav-highlight" id="nav-highlight"></span>
            <ul class="nav-links-list">
                <li><a href="/">Home</a></li>
            </ul>
        </div>
    </nav>

    <section class="login-section">
        <div class="login-card">

            <!-- LEFT: Blob panel -->
            <div class="login-blob-side">
                <h2>Hello, Welcome!</h2>
                <p>Don't have an account?</p>
                <a href="/register" class="ghost-btn">Register</a>
            </div>

            <!-- RIGHT: Form -->
            <div class="login-form-side">
                <h1>Login</h1>
                <form id="login-form" onsubmit="return handleLogin();">
                    <div class="input-box">
                        <input type="text" id="login-email" placeholder="Username" required>
                        <i class="fa-solid fa-user"></i>
                    </div>
                    <div class="input-box">
                        <input type="password" id="login-pass" placeholder="Password" required>
                        <i class="fa-solid fa-lock toggle-eye" onclick="togglePassword('login-pass', this)"></i>
                    </div>
                    <a href="#" class="forgot-link">Forgot Password?</a>

                    <button type="submit" class="login-btn-main">Login</button>

                    <p class="social-text">or login with</p>
                    <div class="social-icons">
                        <a href="#"><i class="fa-brands fa-google"></i></a>
                       
                    </div>
                </form>
            </div>

        </div>
    </section>

    <script src="{{ url_for('static', filename='js/login.js') }}"></script>

</body>
</html>
