<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login - NS Interior Studio AI</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body>
<div class="bg-stage">
  <img class="bg-layer" src="{{ url_for('static', filename='images/living-room-after.png') }}" alt="">
  <img class="bg-layer" src="{{ url_for('static', filename='images/bedroom-after.png') }}" alt="">
  <img class="bg-layer" src="{{ url_for('static', filename='images/kitchen-after.png') }}" alt="">
  <img class="bg-layer" src="{{ url_for('static', filename='images/Bathroom-after.png') }}" alt="">
  <div class="bg-shade"></div><div class="beam"></div><div class="beam b2"></div>
  {% for i in range(18) %}<i class="dust" data-index="{{ i }}"></i>{% endfor %}
</div>
{% include '_nav.html' %}
 
<section class="auth-section">
  <div class="auth-card">
    <div class="showcase">
      <img class="showcase-img" src="{{ url_for('static', filename='images/living-room-after.png') }}" alt="">
      <div class="show-mark">NS</div>
      <h2>Welcome <em>back.</em></h2>
      <p>Pick up your room redesigns right where you left them.</p>
      <a href="/register" class="ghost-btn">Register <i class="fa-solid fa-arrow-right"></i></a>
    </div>
    <div class="form-side">
      <div class="eyebrow on-dark">LOGIN</div>
      <h1>Sign in</h1>
      <form id="login-form" onsubmit="return handleLogin();">
        <div class="field"><input type="email" id="login-email" placeholder=" " required><label>Email</label><i class="fa-solid fa-envelope"></i></div>
        <div class="field"><input type="password" id="login-pass" placeholder=" " required><label>Password</label><i class="fa-solid fa-lock" onclick="togglePassword('login-pass', this)"></i></div>
        <a href="javascript:void(0)" class="forgot-link" onclick="openResetModal()">Forgot Password?</a>
        <button type="submit" class="main-btn">LOGIN</button>
      </form>
    </div>
  </div>
</section>
 
<div id="reset-modal" class="modal-overlay">
  <div class="modal-card">
    <span class="close-modal" onclick="closeResetModal()">&times;</span>
    <h2>Reset Password</h2>
    <p>Enter your registered email and your new password.</p>
    <form onsubmit="return handleResetPassword();">
      <div class="field"><input type="email" id="reset-email" placeholder=" " required><label>Registered Email</label><i class="fa-solid fa-envelope"></i></div>
      <div class="field"><input type="password" id="reset-pass" placeholder=" " required><label>New Password</label><i class="fa-solid fa-lock" onclick="togglePassword('reset-pass', this)"></i></div>
      <button type="submit" class="main-btn">UPDATE PASSWORD</button>
    </form>
  </div>
</div>
<script src="{{ url_for('static', filename='js/nav.js') }}"></script>
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
<script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>
</html>
